<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strata Committee Portal</title>
  <link rel="stylesheet" href="css/style.css?v=10" />
  <script src="https://accounts.google.com/gsi/client" defer></script>
</head>
<body>

  <section id="loginScreen">
    <h1 data-portal-name>Strata Committee Portal</h1>
    <p>Sign in with the Google account the committee has on file to reach the shared documents, to-do list and Slack.</p>
    <div id="googleSignInButton"></div>
    <p id="loginError" hidden></p>
    <p class="login-note">This portal is hosted at 9acambridgestreet.github.io</p>
  </section>

  <div id="portal" hidden>
    <header class="portal-header">
      <h1 data-portal-name>Strata Committee Portal</h1>
      <div class="user-info">
        <img id="userAvatar" alt="" />
        <span id="userName"></span>
        <button id="signOutButton" type="button">Sign out</button>
      </div>
    </header>

    <nav class="portal-nav" id="portalNav">
      <span class="nav-loading">Loading menu&hellip;</span>
    </nav>

    <main id="portalMain"></main>
  </div>

  <script src="js/config.js?v=13"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/app.js?v=17"></script>
</body>
</html>
